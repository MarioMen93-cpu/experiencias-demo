<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Daily Cue</title>
<meta name="description" content="One composition challenge a day. Tomorrow, the Room plays everything.">
<meta name="theme-color" content="#0F0E13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../identidad/marca/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../identidad/marca/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../identidad/marca/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Cue">
<meta property="og:title" content="Daily Cue">
<meta property="og:description" content="One composition challenge a day. Tomorrow, the Room plays everything.">
<meta property="og:image" content="../identidad/marca/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css?v=17">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="logo" href="#home" aria-label="Daily Cue home">Daily <em>Cue</em><span class="cuemark" aria-hidden="true"></span></a>
    <nav class="nav" aria-label="Main">
      <a href="#home" data-ruta="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="nav_home">Home</span></a>
      <a href="#challenge" data-ruta="challenge"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg><span data-t="nav_cue">Today's Cue</span></a>
      <a href="#room" data-ruta="room"><svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span data-t="nav_room">The Room</span></a>
      <a href="#composers" data-ruta="composers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.5c2.6.2 4.4 2 5 4.5"/></svg><span data-t="nav_composers">Composers</span></a>
      <a href="#profile" data-ruta="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span data-t="nav_profile">Profile</span></a>
    </nav>
    <div class="sidebar-pie">
      <a class="btn btn-ghost bloque" href="#suggest" data-t="suggest_btn">Suggest a challenge</a>
      <button class="btn btn-ghost bloque" data-idioma><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z"/></svg><span data-t="lang_switch">Español</span></button>
      <button class="btn btn-ghost bloque" data-tema><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span>Light theme</span></button>
      <button class="btn bloque" data-instalar hidden><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-t="install">Install the app</span></button>
      <p class="fino" data-t="proto_note">Prototype · Phase 0 · no real accounts yet</p>
    </div>
  </aside>

  <main id="vista" class="vista" tabindex="-1"></main>
</div>

<!-- Reproductor persistente: sigue sonando al cambiar de pantalla -->
<div class="player" id="player" hidden>
  <button class="play-btn" id="pPlay" aria-label="Play/pause"></button>
  <div class="p-info">
    <div class="p-titulo" id="pTitulo"></div>
    <div class="p-autor" id="pAutor"></div>
  </div>
  <div class="p-onda-caja"><div id="pMarcas"></div><div class="p-onda" id="pOnda"></div><div class="burbuja" id="burbuja" aria-live="polite"></div></div>
  <span class="mono p-tiempo" id="pTiempo">0:00</span>
  <button class="icon-btn" id="pNext" aria-label="Next in the Room"><svg viewBox="0 0 24 24"><path d="M6 5l10 7-10 7zM18 5v14"/></svg></button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="textos.js?v=17"></script>
<script src="datos.js?v=17"></script>
<script src="app.js?v=17"></script>
<script src="pro.js?v=17"></script>
</body>
</html>
