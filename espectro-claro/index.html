:root{--familia:'Manrope', "Helvetica Neue", Arial, sans-serif;--familia-titulos:'Manrope', "Helvetica Neue", Arial, sans-serif;--acento:#FF5900;--acento-hover:#E04E00;--acento-tx:#BF4200;--acento-suave:#FFC5A3;--sec:#3C3D41;--oscuro:#262626;--papel:#FFFFFF;--fondo:#F1F1F1;--panel:#F1F1F1;--tx:#262626;--tx2:#3C3D41;--tenue:#6B6B6B;--linea:#DBDBDB;--bien:#2E7D5B;--mal:#C62828;--r:14px;--rc:10px;--sombra:0 10px 26px rgba(35,35,35,.08);--sombra-alta:0 14px 32px rgba(35,35,35,.14)}
/* Motor de experiencias · estilo base.
   Los colores, la tipografía y la forma llegan como variables desde los tokens
   del proyecto (construir.py las escribe en :root). Este archivo no nombra un
   solo color: cambiar de proyecto es cambiar de tokens.

   Reglas del diseñador que aquí se vuelven CSS:
   · controles en posiciones fijas (barra inferior que no se mueve);
   · ruta visible arriba como indicador de etapas, sin porcentajes;
   · color solo para estados y cambios;
   · movimiento en tres capas (respuesta, orientación, explicación), nunca
     decorativo; solo transform y opacidad, y todo apagable (reducir movimiento). */

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:120px}
body{background:var(--fondo);color:var(--tx);font-family:var(--familia);font-size:17px;line-height:1.62;
  -webkit-font-smoothing:antialiased;padding:118px 0 96px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acento);outline-offset:3px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
.oculto{display:none!important}
.lector{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- barra superior: título + ruta (indicador de etapas) ---------- */
.cab{position:fixed;inset:0 0 auto 0;z-index:20;background:var(--papel);box-shadow:0 1px 0 var(--linea)}
.pleca{height:6px;background:linear-gradient(90deg,var(--acento) 0 60%,var(--sec) 60% 100%)}
.cab-in{max-width:1080px;margin:0 auto;padding:12px 16px 10px;display:flex;flex-direction:column;gap:8px}
.cab-titulo{font-size:13px;font-weight:700;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ruta{display:flex;gap:4px;list-style:none;overflow-x:auto;scrollbar-width:none}
.ruta::-webkit-scrollbar{display:none}
.ruta li{flex:1 1 0;min-width:96px}
.ruta button{width:100%;border:0;background:none;cursor:pointer;text-align:left;padding:6px 0 0;
  font-size:12.5px;font-weight:700;color:var(--tenue);border-top:4px solid var(--linea)}
.ruta button:disabled{cursor:default}
.ruta .hecha button{color:var(--tx2);border-top-color:var(--sec)}
.ruta .actual button{color:var(--acento-tx);border-top-color:var(--acento)}
.ruta .num{font-weight:800;margin-right:4px}
.ruta button{transition:color .2s,border-color .3s}
.ruta button:not(:disabled):hover{color:var(--tx)}
/* La etapa recién terminada destella una vez: se cerró un tramo de la ruta. */
@keyframes destello{0%{border-top-color:var(--acento);color:var(--acento-tx)}100%{border-top-color:var(--sec)}}
.ruta .recien button{animation:destello .9s ease-out}
.avance{height:3px;background:var(--linea);margin-top:2px;border-radius:2px;overflow:hidden}
.avance span{display:block;height:100%;background:var(--acento);width:0;transition:width .45s cubic-bezier(.2,.8,.3,1)}

/* ---------- pantalla ---------- */
main{max-width:880px;margin:0 auto;padding:0 16px}
.pantalla{background:var(--papel);border-radius:var(--r);box-shadow:var(--sombra);padding:36px 40px 40px;
  view-transition-name:pantalla}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Orientación: la pantalla llega desde el lado hacia el que se avanza. */
@keyframes entra-der{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes entra-izq{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}
@keyframes sale-izq{to{opacity:0;transform:translateX(-44px)}}
@keyframes sale-der{to{opacity:0;transform:translateX(44px)}}
.desde-der{animation:entra-der .32s cubic-bezier(.2,.8,.3,1) both}
.desde-izq{animation:entra-izq .32s cubic-bezier(.2,.8,.3,1) both}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-group(pantalla){animation:none}
::view-transition-old(pantalla){animation:sale-izq .2s ease-in both}
::view-transition-new(pantalla){animation:entra-der .34s cubic-bezier(.2,.8,.3,1) .05s both}
html[data-dir=atras]::view-transition-old(pantalla){animation-name:sale-der}
html[data-dir=atras]::view-transition-new(pantalla){animation-name:entra-izq}
.kick{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:800;color:var(--acento-tx)}
.kick:before{content:'';width:8px;height:8px;background:var(--acento);border-radius:2px;transform:rotate(45deg);flex:none}
h1,h2{font-family:var(--familia-titulos,var(--familia));font-weight:800;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(30px,4.6vw,46px);margin:14px 0 12px}
h2{font-size:clamp(24px,3.4vw,32px);margin:12px 0 4px}
h2:after{content:'';display:block;width:64px;height:5px;margin:14px 0 20px;background:var(--acento);border-radius:3px}
h3{font-size:18px;font-weight:700;margin:20px 0 6px}
.prosa p{max-width:62ch;margin:0 0 14px}
.prosa ul{list-style:none;margin:6px 0 16px;max-width:62ch}
.prosa li{position:relative;padding-left:22px;margin:7px 0}
.prosa li:before{content:'';position:absolute;left:3px;top:.62em;width:7px;height:7px;background:var(--acento);
  border-radius:2px;transform:rotate(45deg)}
.tenue{color:var(--tenue);font-size:14px}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;cursor:pointer;font-weight:700;
  border:2px solid transparent;transition:background .15s,border-color .15s,transform .15s,box-shadow .2s}
.btn:not(:disabled):hover{transform:translateY(-1px)}
.btn:not(:disabled):active{transform:translateY(0) scale(.96);transition-duration:.06s}
.flecha{display:inline-block;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.btn:not(:disabled):hover .flecha{transform:translateX(4px)}
.btn:not(:disabled):hover .flecha.izq{transform:translateX(-4px)}
/* «Siguiente» invita una vez cuando la actividad de la pantalla terminó. */
@keyframes invita{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acento) 55%,transparent)}
  100%{box-shadow:0 0 0 14px color-mix(in srgb,var(--acento) 0%,transparent)}}
.btn-pri.invita{animation:invita .9s ease-out 2}
/* 19 px en negrita = texto grande para WCAG: el blanco sobre el acento pasa AA. */
.btn-pri{background:var(--acento);color:#fff;font-size:19px;padding:10px 26px}
.btn-pri:not(:disabled):hover{background:var(--acento-hover);box-shadow:0 8px 18px color-mix(in srgb,var(--acento) 30%,transparent)}
.btn-sec{background:var(--papel);color:var(--tx);border-color:var(--linea);font-size:16px;padding:9px 20px}
.btn-sec:hover{border-color:var(--sec)}
.btn:disabled{opacity:.4;cursor:default}
.ampliar{display:inline-flex;align-items:center;gap:8px;background:var(--papel);border:1.5px solid var(--linea);
  border-radius:999px;padding:7px 15px;font-size:14.5px;font-weight:700;color:var(--tx);cursor:pointer;margin:4px 6px 4px 0}
.ampliar:before{content:'+';display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
  background:var(--sec);color:#fff;font-size:14px;line-height:1;transition:transform .25s cubic-bezier(.3,1.4,.5,1),background .2s}
.ampliar{transition:border-color .15s,transform .15s}
.ampliar:hover{border-color:var(--acento)}
.ampliar:hover:before{transform:rotate(90deg);background:var(--acento)}
.ampliar:active{transform:scale(.97)}
.ventanas{margin-top:18px;padding-top:16px;border-top:1px solid var(--linea)}
.ventanas .tenue{margin-bottom:6px}

/* ---------- barra inferior: controles siempre en el mismo lugar ---------- */
.pie{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--papel);box-shadow:0 -1px 0 var(--linea)}
.pie-in{max-width:880px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.pie-donde{flex:1;text-align:center;font-size:13px;color:var(--tenue);font-weight:700}

/* ---------- ventana (lo complementario) ---------- */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,20,20,.55);display:grid;place-items:center;padding:16px}
.dialogo{background:var(--papel);border-radius:var(--r);max-width:580px;width:100%;max-height:86vh;overflow:auto;
  padding:30px 32px;box-shadow:var(--sombra-alta);position:relative}
.dialogo h3{margin-top:0;font-size:21px;padding-right:40px}
.cerrar{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;
  background:var(--panel);font-size:20px;line-height:1}

/* ---------- inicio y cierre ---------- */
.inicio-meta{color:var(--tx2);font-size:15px;margin-bottom:22px}
.mapa-ruta{list-style:none;counter-reset:u;margin:14px 0 26px;display:grid;gap:8px}
.mapa-ruta li{counter-increment:u;display:flex;gap:14px;align-items:baseline;background:var(--panel);
  border-radius:var(--rc);padding:12px 16px}
.mapa-ruta li:before{content:counter(u);font-weight:800;color:var(--acento-tx);font-size:18px}
.mapa-ruta b{display:block}
.mapa-ruta span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--tenue)}
.mapa-ruta .partes{list-style:none;margin-top:4px;display:grid;gap:3px}
.mapa-ruta .partes li{display:block;background:none;padding:0 0 0 16px;position:relative;counter-increment:none}
.mapa-ruta .partes li:before{content:'';position:absolute;left:2px;top:.6em;width:6px;height:6px;
  background:var(--acento);border-radius:1px;transform:rotate(45deg)}

/* ---------- predicción ---------- */
.opciones{display:grid;gap:10px;margin:14px 0}
.opcion{text-align:left;border:2px solid var(--linea);background:var(--papel);border-radius:var(--rc);
  padding:12px 16px;cursor:pointer;font-size:16px;font-weight:600;display:flex;gap:10px;align-items:center;
  transition:border-color .15s,background .2s,transform .15s,box-shadow .2s}
.opcion:hover:not(:disabled){border-color:var(--sec);transform:translateY(-1px);box-shadow:var(--sombra)}
.opcion:active:not(:disabled){transform:scale(.985);transition-duration:.06s}
.opcion:disabled{cursor:default}
.opcion.elegida{border-color:var(--sec);background:var(--panel)}
.opcion.correcta{border-color:var(--bien)}
.opcion.incorrecta{border-color:var(--mal)}
/* La palomita y el tache se trazan; la respuesta guardada aparece quieta. */
.marca{width:22px;height:22px;margin-left:auto;flex:none;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.marca.bien{stroke:var(--bien)}.marca.mal{stroke:var(--mal)}
@keyframes traza{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
.marca path{stroke-dasharray:30;stroke-dashoffset:0;animation:traza .32s ease-out .08s backwards}
.marca.mal path+path{animation-delay:.2s}
.quieta .marca path{animation:none}
@keyframes salta{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes sacude{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}
  60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.opcion.salta{animation:salta .32s ease-out}
.opcion.sacude{animation:sacude .36s ease-out}
.revela{background:var(--panel);border-left:5px solid var(--acento);border-radius:0 var(--rc) var(--rc) 0;
  padding:14px 18px;margin-top:6px}
/* Lo que se descubre se despliega de arriba abajo, no aparece de golpe. */
@keyframes desenrolla{from{opacity:0;clip-path:inset(0 0 100% 0);transform:translateY(-4px)}
  to{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
.abre{animation:desenrolla .42s cubic-bezier(.2,.8,.3,1) both}
.retro{font-size:15px;margin-top:8px}
.retro.nueva{animation:entra .25s ease-out both}
.retro.bien{color:var(--bien)}.retro.mal{color:var(--mal)}

/* ---------- preguntas que se arman: varias correctas, ordenar, relacionar, completar ---------- */
.compleja .tenue{margin:6px 0 0;font-size:14px}
.casilla{width:20px;height:20px;flex:none;border:2px solid var(--linea);border-radius:4px;position:relative;
  transition:background .15s,border-color .15s}
.opcion[aria-pressed="true"]{border-color:var(--sec);background:var(--panel)}
.opcion[aria-pressed="true"] .casilla{background:var(--sec);border-color:var(--sec)}
.opcion[aria-pressed="true"] .casilla:after{content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;
  border:solid var(--papel);border-width:0 3px 3px 0;transform:rotate(45deg)}
.opcion.correcta[aria-pressed]{border-color:var(--bien)}.opcion.incorrecta[aria-pressed]{border-color:var(--mal)}
.opcion.faltaba{border-style:dashed;border-color:var(--bien)}
.falta-et{margin-left:auto;font-size:13px;font-weight:700;color:var(--bien)}
.comprobar{margin-top:6px}
.comprobar:disabled{opacity:.45;cursor:default}
.ordenar-lista{list-style:none;margin:12px 0;display:grid;gap:8px;counter-reset:orden}
.ordenar-item{counter-increment:orden;display:flex;align-items:center;gap:10px;background:var(--papel);
  border:2px solid var(--linea);border-radius:var(--rc);padding:10px 12px;font-weight:600}
.ordenar-item:before{content:counter(orden);font-weight:800;color:var(--acento-tx);min-width:1.2em}
.ordenar-item[draggable="true"]{cursor:grab}
.ordenar-item.arrastrando{opacity:.5}
.ordenar-item.bien{border-color:var(--bien)}.ordenar-item.mal{border-color:var(--mal)}
.asa{color:var(--tenue);font-size:18px;line-height:1}
.ordenar-texto{flex:1}
.mover-caja{display:flex;gap:4px}
.mover{width:36px;height:36px;border:1px solid var(--linea);border-radius:8px;background:var(--panel);
  cursor:pointer;font-size:16px;font-weight:700;color:inherit}
.mover:disabled{opacity:.3;cursor:default}
.orden-correcto{background:var(--panel);border-radius:var(--rc);padding:12px 16px;font-size:15px}
.orden-correcto ol{margin:6px 0 0 1.2em}
.relacionar-tabla{display:grid;gap:8px;margin:12px 0}
.relacionar-fila{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:10px;align-items:center;
  background:var(--papel);border:2px solid var(--linea);border-radius:var(--rc);padding:10px 12px}
.relacionar-fila label{font-weight:700}
.relacionar-fila.bien{border-color:var(--bien)}.relacionar-fila.mal{border-color:var(--mal)}
.relacionar-fila .corrige{grid-column:1/-1;font-size:14px;color:var(--bien);font-weight:600}
.compleja select{font:inherit;font-size:15px;padding:8px 10px;border:2px solid var(--linea);border-radius:8px;
  background:var(--papel);color:inherit;max-width:100%}
.compleja select.bien{border-color:var(--bien)}.compleja select.mal{border-color:var(--mal)}
.completar-texto{font-size:17px;line-height:2.1;margin:12px 0}
.completar-texto select{margin:0 4px;padding:4px 8px}
.completar-texto .corrige{color:var(--bien);font-weight:700;font-size:15px}
@media (max-width:600px){.relacionar-fila{grid-template-columns:1fr}}

/* ---------- pasos (cadena causal o secuencia) ---------- */
.cadena{list-style:none;margin:16px 0}
.eslabon{background:var(--panel);border-radius:var(--rc);padding:14px 18px}
/* Explicación: el conector «provoca» crece primero; después llega su efecto. */
@keyframes crece{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.enlace.nuevo{animation:aparece .2s ease-out .12s both}
.enlace.nuevo:before{transform-origin:top;animation:crece .26s ease-out both}
.eslabon.nuevo{animation:entra .32s cubic-bezier(.2,.8,.3,1) .26s both}
.eslabon .n{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acento-tx)}
.eslabon b{display:block;font-size:17px;margin:2px 0}
.enlace{display:flex;align-items:center;gap:10px;margin:6px 0 6px 22px;color:var(--tx2);font-size:13px;font-weight:700}
.enlace{position:relative}
.enlace:before{content:'';width:3px;height:30px;background:var(--acento);border-radius:2px}
.enlace:after{content:'';position:absolute;left:-3.5px;bottom:-1px;border:5px solid transparent;
  border-top:7px solid var(--acento);border-bottom:0}
.enlace.nuevo:after{animation:aparece .15s ease-out .22s both}

/* ---------- estados (antes / después) ---------- */
.conmutador{display:inline-flex;background:var(--panel);border-radius:999px;padding:4px;margin:6px 0 16px;position:relative}
.conmutador button{border:0;background:none;border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer;
  color:var(--tx2);position:relative;z-index:1;transition:color .25s}
.conmutador button[aria-pressed="true"]{color:#fff}
/* La píldora se desliza al estado elegido; hasta que se mide, el botón pinta su fondo. */
.pildora{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--sec);
  transition:transform .34s cubic-bezier(.3,1.25,.5,1),width .34s cubic-bezier(.3,1.25,.5,1)}
.conmutador:not(.lista) button[aria-pressed="true"]{background:var(--sec)}
.estado-desc{margin-bottom:12px;max-width:62ch}
.rasgos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.rasgo{border:1px solid var(--linea);border-radius:var(--rc);padding:12px 14px;transition:background .25s}
.rasgo span{display:block;font-size:12.5px;font-weight:700;color:var(--tenue)}
.rasgo b{font-size:16.5px}
.rasgo.cambia{background:var(--acento-suave);border-color:var(--acento)}
.rasgo b{display:inline-block}
/* El rasgo que cambia late una vez al cambiar de estado. */
@keyframes late{0%{transform:scale(1)}35%{transform:scale(1.03)}100%{transform:scale(1)}}
.late{animation:late .38s ease-out}

/* ---------- comparador ---------- */
.tabla{width:100%;border-collapse:separate;border-spacing:0;margin:10px 0 6px;font-size:15.5px}
.tabla th,.tabla td{padding:11px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--linea)}
.tabla thead th{background:var(--sec);color:#fff;font-size:15px}
.tabla thead th:first-child{border-radius:var(--rc) 0 0 0}.tabla thead th:last-child{border-radius:0 var(--rc) 0 0}
.tabla tbody th{font-weight:700;color:var(--tx2);width:30%}
.comprueba{margin-top:22px;padding-top:18px;border-top:1px solid var(--linea)}

/* ---------- deslizador ---------- */
.desliza{margin:10px 0 4px}
.formula{display:inline-block;font-size:22px;font-weight:800;background:var(--panel);border-radius:var(--rc);
  padding:8px 18px;margin-bottom:16px;font-variant-numeric:tabular-nums}
.rango{display:flex;align-items:center;gap:14px;font-weight:700}
.rango input{flex:1;accent-color:var(--acento);height:28px}
.lienzo{height:96px;background:var(--panel);border-radius:var(--rc);margin:16px 0 10px;position:relative;overflow:hidden}
.lienzo .linea{position:absolute;top:16px;bottom:16px;width:6px;margin-left:-3px;background:var(--sec);border-radius:3px;
  transition:left .3s cubic-bezier(.3,1.3,.5,1)}
.lienzo .barra{position:absolute;left:0;top:34px;height:28px;background:var(--acento);border-radius:0 6px 6px 0;
  transition:width .3s cubic-bezier(.3,1.3,.5,1)}

/* ---------- espectro: líneas de emisión sobre fondo oscuro ---------- */
/* El arcoíris tenue es el eje de longitudes de onda (contenido, no marca). */
.espectro-caja{margin:18px 0 6px}
.espectro{position:relative;height:104px;border-radius:var(--rc);overflow:hidden;background:var(--oscuro)}
.escala{position:absolute;left:0;right:0;bottom:0;height:10px;opacity:.55;
  background:linear-gradient(90deg,#6a3df0,#2f6bff,#16b8c9,#3fcf5a,#f2e33a,#ff9a1f,#ff3b2f)}
.raya{position:absolute;top:12px;bottom:22px;width:5px;margin-left:-2.5px;border-radius:3px;background:#fff;
  box-shadow:0 0 8px 2px color-mix(in srgb,var(--acento) 85%,transparent),0 0 22px 6px color-mix(in srgb,var(--acento) 40%,transparent);
  transition:left .7s cubic-bezier(.25,1.35,.45,1),opacity .4s}
.espectro.dividida .raya:not(.central){opacity:.82}
.desliza .espectro{margin:14px 0 10px}
.desliza .espectro .raya{transition:left .28s cubic-bezier(.3,1.3,.5,1)}
/* Al encender el campo, la línea parpadea antes de abrirse. */
@keyframes enciende{0%{filter:brightness(1)}30%{filter:brightness(1.8)}100%{filter:brightness(1)}}
.espectro.campo{animation:enciende .5s ease-out}
.espectro-pie{margin-top:6px}
.lectura-desliza{min-height:3.2em}

/* ---------- línea de tiempo ---------- */
.hitos{list-style:none;margin:14px 0;border-left:3px solid var(--linea);padding-left:22px}
.hito{position:relative;margin:0 0 18px}
.hito:before{content:'';position:absolute;left:-30px;top:6px;width:11px;height:11px;background:var(--acento);
  border-radius:2px;transform:rotate(45deg)}
.hito .fecha{font-size:13px;font-weight:800;color:var(--acento-tx);letter-spacing:.06em}
.hito b{display:block;font-size:17px}

/* ---------- panel ---------- */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:14px 0}
.item{border:1px solid var(--linea);border-radius:var(--rc);padding:16px;display:flex;flex-direction:column;gap:6px}
.item b{font-size:16.5px}
.item p{font-size:15px;color:var(--tx2);flex:1}

/* ---------- reflexión y quiz ---------- */
.reflexion textarea{width:100%;min-height:140px;border:2px solid var(--linea);border-radius:var(--rc);padding:14px;
  resize:vertical;margin:10px 0 6px;background:var(--papel)}
.reflexion textarea:focus{border-color:var(--sec);outline:none}
.pregunta{margin:0 0 26px}
.pregunta h3{margin-top:4px}
.puntos{background:var(--panel);border-radius:var(--rc);padding:14px 18px;font-weight:700}
.cifra{font-variant-numeric:tabular-nums}
.medidor{height:8px;border-radius:4px;background:var(--linea);margin-top:10px;overflow:hidden}
.medidor span{display:block;height:100%;width:0;background:var(--acento);border-radius:4px;
  transition:width .7s cubic-bezier(.2,.8,.3,1)}

@media(max-width:640px){
  body{padding-top:112px;font-size:16.5px}
  .pantalla{padding:24px 18px 28px;border-radius:0}
  main{padding:0}
  .ruta li{min-width:84px}
  .pie-donde{display:none}
  .pie-in{justify-content:space-between}
  /* La tabla se vuelve fichas por criterio: cada valor dice de qué opción es. */
  .tabla thead{display:none}
  .tabla,.tabla tbody,.tabla tr,.tabla th,.tabla td{display:block;width:100%}
  .tabla tbody tr{border-bottom:1px solid var(--linea);padding:10px 0}
  .tabla th,.tabla td,.tabla tbody th{border:0;padding:4px 12px;width:100%;max-width:none}
  .tabla td:before{content:attr(data-op);display:block;font-size:12.5px;font-weight:700;color:var(--tenue)}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
@media print{.cab,.pie{display:none}body{padding:0;background:#fff}.pantalla{box-shadow:none}}
.figura{margin:18px 0}.figura img{width:100%;aspect-ratio:3/1;max-height:220px;object-fit:cover;border-radius:var(--rc);display:block}
.figura figcaption{margin-top:6px;font-size:14px}
/* Portada: la imagen ocupa el borde superior de la tarjeta de inicio. */
.portada{margin:-36px -40px 28px;position:relative}
.portada img{width:100%;aspect-ratio:16/7;object-fit:cover;display:block;border-radius:var(--r) var(--r) 0 0}
.portada:after{content:'';position:absolute;left:0;right:0;bottom:0;height:6px;
background:linear-gradient(90deg,var(--acento) 0 60%,var(--sec) 60% 100%)}
.portada figcaption{display:none}
.pantalla>.btn{margin-top:20px}
@media(max-width:640px){.portada{margin:-24px -18px 22px}.portada img{border-radius:0;aspect-ratio:16/9}}

/* ---------- repaso: equivocarse lleva de vuelta ---------- */
.repasar{display:inline-flex;align-items:center;gap:8px;margin-top:8px;background:var(--papel);
  border:1.5px solid var(--acento);color:var(--acento-tx);border-radius:999px;padding:6px 14px;
  font-size:14.5px;font-weight:700;cursor:pointer;transition:transform .15s,background .15s}
.repasar:hover{transform:translateY(-1px)}
.repasar:hover .flecha{transform:translateX(4px)}
.volver{position:fixed;left:50%;bottom:84px;z-index:25;transform:translateX(-50%);display:inline-flex;gap:8px;
  align-items:center;background:var(--oscuro);color:#fff;border:0;border-radius:999px;padding:11px 20px;
  font-size:15.5px;font-weight:700;cursor:pointer;box-shadow:var(--sombra-alta);animation:aparece .3s ease-out}
.volver:hover .flecha{transform:translateX(-4px)}
/* Pulso de atención (una vez) en la pregunta a la que se regresó. */
@keyframes senala{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acento) 55%,transparent)}
  100%{box-shadow:0 0 0 16px color-mix(in srgb,var(--acento) 0%,transparent)}}
.pregunta.senala{animation:senala 1.2s ease-out;border-radius:var(--rc)}

/* ---------- pilares: una estructura que se arma ---------- */
.pilares-escena{margin:18px 0 12px;padding:22px 22px 0;background:var(--panel);border-radius:var(--rc);overflow:hidden}
.techo{margin:0 3%;background:var(--acento);color:#fff;text-align:center;font-weight:800;font-size:19px;
  padding:10px 14px;border-radius:8px;position:relative;z-index:1}
.columnas{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:5%;padding:0 9%;height:170px;align-items:end}
.pilar{height:100%;background:var(--sec);color:#fff;border-radius:4px 4px 0 0;display:flex;align-items:center;
  justify-content:center;text-align:center;padding:8px;font-weight:700;font-size:15px;line-height:1.25;transform-origin:bottom}
.base{background:var(--acento-suave);border:2px solid var(--acento);color:var(--tx);text-align:center;font-weight:800;
  font-size:16px;padding:12px;margin:0 -22px;border-radius:0}
.pilares-escena>.columnas:last-child{margin-bottom:22px}
@keyframes levanta{from{transform:scaleY(0);opacity:.2}to{transform:none;opacity:1}}
@keyframes baja{from{transform:translateY(-46px);opacity:0}to{transform:none;opacity:1}}
@keyframes asienta{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes enciende-item{from{opacity:.28}to{opacity:1}}
.arma .base{animation:asienta .5s cubic-bezier(.33,1,.68,1) both}
.arma .pilar{animation:levanta .55s cubic-bezier(.33,1,.68,1) both;animation-delay:calc(var(--t) * .42s + .1s)}
.arma .pilar span{animation:aparece .3s ease-out both;animation-delay:calc(var(--t) * .42s + .5s)}
.arma .techo{animation:baja .6s cubic-bezier(.34,1.25,.64,1) both;animation-delay:calc(var(--t) * .42s + .15s)}
.leyenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.leyenda-item{border:1px solid var(--linea);border-left:4px solid var(--sec);border-radius:var(--rc);padding:10px 12px}
.leyenda-item.es-base{border-left-color:var(--acento);grid-column:1/-1}
.leyenda-item b{display:block}.leyenda-item p{font-size:15px;color:var(--tx2);margin-top:2px}
.arma .leyenda-item{animation:enciende-item .5s ease-out both;animation-delay:calc(var(--t) * .42s + .2s)}
.otra-vez:before{content:'↻'}

/* ---------- plan de acción ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.chip{border:1.5px solid var(--linea);background:var(--papel);color:var(--tx);border-radius:999px;padding:8px 15px;
  font-size:15px;font-weight:700;cursor:pointer;transition:border-color .15s,background .2s,transform .15s}
.chip:hover{border-color:var(--sec)}
.chip:active{transform:scale(.97)}
.chip[aria-checked="true"]{border-color:var(--acento);background:var(--acento-suave)}
.campo{display:block;margin:16px 0 6px}.campo b{display:block}
.plan textarea{width:100%;border:2px solid var(--linea);border-radius:var(--rc);padding:12px 14px;resize:vertical;
  background:var(--papel);color:var(--tx)}
.plan textarea:focus{border-color:var(--sec);outline:none}
.plan-acciones{margin-top:18px}.plan-acciones .tenue{margin-top:8px}
#ficha{display:none}
@media print{
  body.imprimiendo>*:not(#ficha){display:none!important}
  body.imprimiendo{padding:0;background:#fff!important}
  body.imprimiendo #ficha{display:block;font-family:var(--familia);color:#262626;max-width:680px;margin:0 auto;padding:12px}
  body #ficha h1,body #ficha h2{color:#232323;-webkit-text-stroke:0;background:none;font-family:var(--familia-titulos,var(--familia))}
  body #ficha h1{font-size:28px;margin:6px 0 2px}
  body #ficha h2{font-size:16px;margin:0 0 6px}
  body #ficha h2:after{display:none}
  .ficha-kick{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#BF4200;font-weight:800}
  .ficha-fecha{color:#6B6B6B;font-size:13px}
  .ficha-bloque{border-top:2px solid #FF5900;margin-top:18px;padding-top:10px}
  .ficha-eleccion{font-size:18px;font-weight:700}
  body #ficha .prosa p{color:#232323}
}
@media(max-width:640px){
  .columnas{height:140px;padding:0 4%}
  .pilar{font-size:13px;padding:6px 4px}
  .techo{font-size:19px}
  .volver{bottom:80px}
}

/* ---------- pie: índice y modo presentación ---------- */
.pie-centro{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.pie-centro .pie-donde{flex:0 1 auto}
.pie-ico{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--linea);background:var(--papel);color:var(--tx);
  cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center;transition:border-color .15s,transform .15s}
.pie-ico:hover{border-color:var(--sec);transform:translateY(-1px)}
.indice{display:grid;gap:14px}
.indice-etapa b{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--acento-tx)}
.indice ol{list-style:none;margin:6px 0 0;display:grid;gap:4px}
.indice-item{width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--tx)}
.indice-item:hover:not(:disabled){background:var(--panel)}
.indice-item.actual{background:var(--acento-suave)}
.indice-item:disabled{color:var(--tenue);cursor:default}
/* Modo presentación: para proyectar. Más grande, sin distracciones. */
body.presentacion{font-size:20px}
body.presentacion main{max-width:1180px}
body.presentacion .pantalla{padding:48px 64px}
body.presentacion h2{font-size:42px}

/* ---------- recuerda (recuperación intercalada) ---------- */
.recuerda{border:1.5px dashed var(--acento);border-radius:var(--rc);padding:14px 18px 2px;margin:4px 0 18px}
.recuerda .pregunta{margin-bottom:12px}
.recuerda h3{font-size:16.5px}

/* ---------- clasificar ---------- */
.clasif{margin:10px 0}
.clasif-fila{border:1px solid var(--linea);border-radius:var(--rc);padding:12px 14px;margin:10px 0;transition:border-color .3s}
.clasif-fila.bien{border-color:var(--bien)}.clasif-fila.mal{border-color:var(--mal)}
.clasif-texto{margin:0 0 8px;font-weight:600}
.clasif-opciones{display:flex;flex-wrap:wrap;gap:6px}
.chip.acierto{border-color:var(--bien);box-shadow:inset 0 0 0 1px var(--bien)}
.chip.fallo{border-color:var(--mal);text-decoration:line-through}
.chip:disabled{cursor:default}
.clasif-retro .retro{display:flex;gap:6px;align-items:flex-start}
.clasif-retro .marca{margin-left:0;width:18px;height:18px;flex:none;margin-top:2px}
.clasif-acciones{display:flex;gap:10px;margin:14px 0}

/* ---------- escenario ---------- */
.sello{display:inline-block;font-size:13px;font-weight:700;color:var(--acento-tx);border:1.5px solid var(--acento);
  border-radius:999px;padding:4px 12px;margin:4px 0 12px}
.esc-paso{border-left:3px solid var(--linea);padding:2px 0 2px 16px;margin:12px 0}
.esc-paso.actual{border-left-color:var(--acento)}
.esc-paso.hecho{opacity:.8}
.esc-sit{font-weight:600;margin:0 0 8px}
.esc-elegido{margin:0 0 6px;font-size:15px}
.esc-conse{background:var(--panel);border-radius:var(--rc);padding:10px 14px;font-size:15px}
.esc-conse .prosa p{margin:4px 0 0}
.esc-cal{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1.5px solid}
.buena .esc-cal,.esc-conse.buena .esc-cal{color:var(--bien)}
.regular .esc-cal,.esc-conse.regular .esc-cal{color:var(--acento-tx)}
.mala .esc-cal,.esc-conse.mala .esc-cal{color:var(--mal)}
.esc-fin{border:1px solid var(--linea);border-radius:var(--rc);padding:14px 18px;margin-top:14px}
.esc-resumen{margin:8px 0 12px 20px;display:grid;gap:6px}

/* ---------- gráfica ---------- */
.grafica{margin:16px 0}
.grafica-titulo{font-weight:800;margin-bottom:10px}
.barras{display:grid;gap:10px}
.barra-fila{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:12px;align-items:center}
.barra-et{font-size:15px;font-weight:600}
.barra-pista{height:16px;background:var(--panel);border-radius:8px;overflow:hidden}
.barra-valor{display:block;height:100%;width:var(--w);background:var(--sec);border-radius:8px;
  animation:llena .9s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i) * .08s)}
.barra-fila.nota .barra-valor{background:var(--acento)}
.barra-num{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
@keyframes llena{from{width:0}}
.linea-caja{overflow-x:auto}
.linea-svg{width:100%;max-width:640px;height:auto;display:block}
.linea-svg .traza{fill:none;stroke:var(--sec);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;
  stroke-dasharray:2000;stroke-dashoffset:0;animation:traza-linea 1.4s cubic-bezier(.65,0,.35,1) backwards}
@keyframes traza-linea{from{stroke-dashoffset:2000}}
.linea-svg .punto{fill:var(--papel);stroke:var(--sec);stroke-width:2.5}
.linea-svg .punto.nota{fill:var(--acento);stroke:var(--acento)}
.linea-svg text{fill:var(--tx2);font-size:14px;font-family:var(--familia)}
.linea-svg text.val{font-weight:700;fill:var(--tx)}
.prop{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.prop-rejilla{display:grid;grid-template-columns:repeat(10,14px);gap:4px}
.prop-rejilla span{width:14px;height:14px;border-radius:50%;background:var(--linea)}
.prop-rejilla span.lleno{background:var(--acento);animation:aparece .3s ease-out both;animation-delay:calc(var(--i) * 8ms)}
.prop-lectura{font-size:18px;max-width:28ch;margin:0}
.prop-lectura b{color:var(--acento-tx);font-size:26px}
.anotaciones{list-style:none;margin:12px 0 4px;display:grid;gap:6px}
.anotaciones li{padding-left:16px;position:relative;font-size:15px}
.anotaciones li:before{content:'';position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--acento)}
.grafica-fuente{margin-top:8px}

/* ---------- práctica con datos ---------- */
.practica-tabla{margin:12px 0}
.practica-titulo{font-size:14px;font-weight:700;color:var(--tx2);margin-bottom:6px}
.practica code,.practica .opcion{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14.5px}
.tabla-desliza{overflow-x:auto}
.tabla.datos{font-size:14.5px}
.tabla.datos tbody th,.tabla.datos td{width:auto}
.tabla.resultado thead th{background:var(--acento);color:#fff}

/* ---------- simulación de pulsos ---------- */
.lienzo.pulsos .tren{position:absolute;left:0;right:0;top:16px;bottom:26px}
.lienzo.pulsos .pulso{position:absolute;top:10%;bottom:0;width:3px;margin-left:-1.5px;background:var(--acento);border-radius:2px}
.lienzo.pulsos .eje-t{position:absolute;right:12px;bottom:6px;font-size:12px;color:var(--tenue)}
@media(max-width:640px){
  .barra-fila{grid-template-columns:1fr auto}
  .barra-pista{grid-column:1/-1;grid-row:2}
  .pie-centro{flex:0 0 auto}
}
/* En celular el pie lleva cuatro controles: «Anterior» queda en su flecha y
   el lugar de la ruta (que ya se ve arriba) se oculta. */
@media(max-width:480px){
  .pie-in{gap:8px;padding:10px 12px}
  .pie-centro{gap:4px}
  .pie-centro .pie-donde{display:none}
  .pie-ico{width:36px;height:36px}
  .anterior-tx{display:none}
  #anterior{padding-left:14px;padding-right:14px}
}

/* ---------- imagen con zonas ---------- */
/* Imagen y explicación juntas: se toca y se lee sin desplazarse. */
.zonas-lienzo{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px);gap:18px;align-items:start;margin:12px 0}
.zonas-figura{margin:0;display:flex;flex-direction:column;align-items:center}
.zonas-marco{position:relative;margin:0 40px;max-width:calc(100% - 80px);line-height:0}
.zonas-marco img{display:block;max-width:100%;height:auto;max-height:min(58vh,560px);border-radius:8px}
.zonas-figura figcaption{margin-top:8px;line-height:1.35;text-align:center}
.zonas-trazos{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.zonas-trazos line{stroke:var(--acento);stroke-width:1.2;opacity:.7;transition:stroke-width .2s,opacity .2s}
.zonas-trazos line.vista{opacity:.35}
.zonas-trazos line.activa{stroke-width:2.4;opacity:1}
/* Un aro fino alrededor del punto: enmarca, no tapa. */
.zona-aro{position:absolute;width:18px;height:18px;transform:translate(-50%,-50%);border-radius:50%;
  border:1.5px solid var(--acento);cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.25);transition:width .2s,height .2s,border-width .2s}
.zona-aro.vista{opacity:.45}
.zona-aro.activa{width:26px;height:26px;border-width:2px;opacity:1}
.zona-aro.hallada{border-color:var(--bien);opacity:1}
.zona-boton{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;
  border:1.5px solid var(--acento);background:var(--papel);color:var(--acento-tx);font-weight:800;font-size:13px;
  cursor:pointer;padding:0;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.zona-boton.izq{left:-36px}.zona-boton.der{right:-36px}
.zona-boton:hover:not(:disabled){background:var(--panel)}
.zona-boton.vista{border-color:var(--linea);color:var(--tenue)}
.zona-boton.activa{background:var(--acento);border-color:var(--acento);color:#fff}
.zona-boton.hallada{background:var(--bien);border-color:var(--bien);color:#fff}
.zona-boton:disabled{cursor:default}
.zona-boton.sacude{animation:sacude-boton .36s ease-out}
@keyframes sacude-boton{0%,100%{transform:translateY(-50%)}25%{transform:translate(-5px,-50%)}75%{transform:translate(5px,-50%)}}
.zonas-panel{position:sticky;top:12px}
.zonas-consigna{margin:0 0 8px;font-size:14.5px;font-weight:500;line-height:1.45;color:var(--tenue)}
.zonas-pedido{font-weight:600;margin:0 0 10px;font-size:15px}
.zonas-ficha{background:var(--panel);border-left:5px solid var(--acento);border-radius:0 var(--rc) var(--rc) 0;padding:12px 16px;margin:0 0 12px}
.zonas-ficha.bien{border-left-color:var(--bien)}.zonas-ficha.mal{border-left-color:var(--mal)}
.zonas-ficha h3{margin:0 0 6px;font-size:17px}
.zonas-ficha .prosa p{margin:0}
.zonas-leyenda{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.zonas-item{width:100%;text-align:left;display:flex;align-items:center;gap:10px;border:1.5px solid var(--linea);
  background:var(--papel);color:inherit;border-radius:10px;padding:7px 10px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.zonas-item .n{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--acento);color:var(--acento-tx);
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.zonas-item.vista .n{border-color:var(--linea);color:var(--tenue)}
.zonas-item[aria-pressed="true"]{border-color:var(--acento)}
.zonas-item[aria-pressed="true"] .n{background:var(--acento);border-color:var(--acento);color:#fff}
@media (max-width:760px){
  /* Debajo de la figura, primero lo que se tocó; la consigna después. */
  .zonas-panel{display:flex;flex-direction:column}
  .zonas-pedido{order:1}.zonas-detalle{order:2}.zonas-consigna{order:3}.zonas-leyenda{order:4}
  .zonas-lienzo{grid-template-columns:1fr;gap:10px}
  .zonas-marco img{max-height:46vh}
  .zonas-panel{position:static}
}
@media (prefers-reduced-motion:reduce){.zona-aro,.zona-boton,.zonas-trazos line{transition:none}}

/* ---------- video con pausas ---------- */
.video-caja{margin:12px 0}
.video{display:block;width:100%;max-height:70vh;background:#000;border-radius:var(--rc)}
.video-pregunta:not(:empty){background:var(--panel);border-left:5px solid var(--acento);border-radius:0 var(--rc) var(--rc) 0;
  padding:14px 18px;margin:12px 0;animation:desenrolla .42s cubic-bezier(.2,.8,.3,1) both}
.video-acciones{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.video-pausas{list-style:none;margin:10px 0;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--tenue);font-weight:600}
.video-pausas li{display:flex;align-items:center;gap:6px}
.video-pausas li .marca{margin-left:0;width:18px;height:18px}
.punto-pausa{width:10px;height:10px;border-radius:50%;border:2px solid var(--acento);display:inline-block}
#escuchar[aria-pressed="true"]{background:var(--acento);color:#fff;border-color:var(--acento)}

/* ---------- deslizador «emisión»: color y pico de la luz según la temperatura ---------- */
.lienzo.emision{height:auto;display:grid;grid-template-columns:96px minmax(0,1fr);grid-template-rows:auto auto;gap:4px 18px;
  padding:16px 18px 12px;align-items:center;overflow:visible}
.emision-estrella{width:84px;height:84px;border-radius:50%;grid-row:1/3;transition:background .25s,box-shadow .25s}
.emision-grafica{position:relative;padding-bottom:18px}
.emision-svg{display:block;width:100%;height:120px;overflow:visible}
.emision-area{fill:var(--acento);opacity:.12}
.emision-curva{fill:none;stroke:var(--tx);stroke-width:2}
.emision-pico{stroke:var(--acento);stroke-width:1.5;stroke-dasharray:3 3}
.emision-ejes span{position:absolute;bottom:0;transform:translateX(-50%);font-size:11.5px;color:var(--tenue);white-space:nowrap}
.emision-dicho{grid-column:2;margin:0;font-size:14.5px;font-weight:600}
@media (max-width:600px){.lienzo.emision{grid-template-columns:64px minmax(0,1fr);gap:4px 12px}.emision-estrella{width:58px;height:58px}}

 **temperatura superficial**. Mueve el control y observa qué color de luz predomina en cada extremo.", "piezas": ["p3"], "ventanas": [], "figura": {"busqueda": "", "proposito": "", "img": "", "alt": "", "pie": "", "encuadre": "centro"}, "objetivos": [1], "simbolo": "T", "nombre": "Temperatura superficial", "formula": "", "efecto": "Color de la luz que predomina y posición del pico de emisión en el espectro", "relacion": "directa", "visual": "emision", "lineas": 0, "bajo": "Estrella fría: emite más luz roja; su pico de emisión cae hacia el rojo.", "alto": "Estrella caliente: emite más luz azul; su pico de emisión se recorre hacia el azul."}, {"componente": "lectura", "titulo": "De O a M: la Clasificación Espectral de Harvard", "texto": "La **Clasificación Espectral de Harvard** ordena las estrellas por temperatura, de la más caliente a la más fría. Cada tipo tiene su patrón espectral:\n- **O** · azules · 30,000–50,000 K · helio ionizado; muy luminosas\n- **B** · azul brillante · 10,000–30,000 K · hidrógeno moderado y helio neutro\n- **A** · blanco-azuladas · 7,500–10,000 K · máxima intensidad del hidrógeno\n- **F** · blanco-amarillentas · 6,000–7,500 K · destacan metales ionizados\n- **G** · amarillas · 5,200–6,000 K · metales y calcio\n- **K** · naranja · 3,700–5,200 K · metales neutros\n- **M** · rojas frías · <3,700 K · moléculas como TiO", "piezas": ["p4", "p3"], "ventanas": [{"etiqueta": "¿Qué tipo de estrella es el Sol?", "titulo": "El Sol, una estrella G", "cuerpo": "El Sol es una estrella tipo G: amarilla, con temperatura de 5,200–6,000 K y predominio de metales y líneas de calcio en su espectro."}], "figura": {"busqueda": "", "proposito": "", "img": "", "alt": "", "pie": "", "encuadre": "centro"}, "objetivos": [2, 1]}]}, {"unidad": "aplicacion", "titulo": "Leer un espectro estelar", "pantallas": [{"componente": "clasificar", "titulo": "Del rasgo al tipo espectral", "texto": "Usa la clasificación al revés: a partir de una pista del espectro o de la temperatura, reconoce el tipo de estrella.", "piezas": ["p4", "p7"], "ventanas": [], "figura": {"busqueda": "", "proposito": "", "img": "", "alt": "", "pie": "", "encuadre": "centro"}, "objetivos": [2], "consigna": "Asigna cada pista del espectro o de la temperatura al tipo espectral de estrella que le corresponde.", "categorias": ["Tipo O", "Tipo A", "Tipo G", "Tipo M"], "elementos": [{"texto": "Dominada por líneas de helio ionizado", "categoria": 0, "explicacion": "Las estrellas tipo O, azules y muy luminosas, tienen espectros dominados por líneas de helio ionizado."}, {"texto": "Entre 30,000 y 50,000 K", "categoria": 0, "explicacion": "Es el rango de temperatura de las estrellas tipo O, las más calientes de la Clasificación de Harvard."}, {"texto": "Máxima intensidad en las líneas de hidrógeno", "categoria": 1, "explicacion": "En las estrellas tipo A, blanco–azuladas, las líneas de hidrógeno alcanzan su máxima intensidad."}, {"texto": "Entre 7,500 y 10,000 K", "categoria": 1, "explicacion": "Es el rango de temperatura de las estrellas tipo A."}, {"texto": "Predominio de metales y líneas de calcio", "categoria": 2, "explicacion": "El espectro de las estrellas tipo G muestra predominio de metales y líneas de calcio."}, {"texto": "Amarilla, como el Sol", "categoria": 2, "explicacion": "Las estrellas tipo G son amarillas, y el Sol es el ejemplo de este tipo."}, {"texto": "Abundancia de moléculas como TiO", "categoria": 3, "explicacion": "Las estrellas tipo M son tan frías que en su espectro abundan moléculas como el TiO."}, {"texto": "Menos de 3,700 K, roja", "categoria": 3, "explicacion": "Las estrellas tipo M son rojas y frías, con temperaturas menores a 3,700 K."}]}, {"componente": "prediccion", "titulo": "¿Qué dice una línea más ancha?", "texto": "Las líneas no solo revelan qué elementos hay en una estrella. Antes de seguir, piensa: si una línea de absorción se ve más **ancha**, ¿qué te dice de la estrella?", "piezas": ["p5"], "ventanas": [], "figura": {"busqueda": "", "proposito": "", "img": "", "alt": "", "pie": "", "encuadre": "centro"}, "objetivos": [3], "pregunta": "Si una línea de absorción en el espectro de una estrella se ve más ancha, ¿qué indica?", "opciones": [{"texto": "Que la atmósfera de la estrella tiene mayor densidad y presión.", "correcta": true, "retro": "Las líneas más anchas señalan una atmósfera estelar con mayor densidad y presión: los átomos comprimidos interactúan más entre sí y amplían el rango de frecuencias en que absorben luz."}, {"texto": "Que hay mayor abundancia de ese elemento en la estrella.", "correcta": false, "retro": "La abundancia del elemento la indica la profundidad («hondura») de la línea, no su ancho: líneas más profundas implican mayor cantidad de ese elemento."}, {"texto": "Que el gas de la estrella está a mayor temperatura.", "correcta": false, "retro": "La temperatura del gas la indica el grado de ionización: cuanto mayor la ionización, mayor la temperatura necesaria para separar electrones de los átomos."}], "revelacion": "El **ancho** de una línea habla de la **presión atmosférica**. En ambientes más comprimidos, los átomos interactúan más entre sí, y eso amplía el rango de frecuencias en que absorben luz. Por eso una línea más ancha señala una atmósfera con mayor densidad y presión.", "visual": "ninguno", "lineas": 0}, {"componente": "comparador", "titulo": "Ionización, ancho y profundidad", "texto": "Compara las tres lecturas de una línea espectral: qué observas y qué te revela de la estrella.", "piezas": ["p5"], "ventanas": [], "figura": {"busqueda": "", "proposito": "", "img": "", "alt": "", "pie": "", "encuadre": "centro"}, "objetivos": [3], "opciones": ["Ionización", "Ancho de línea", "Profundidad"], "criterios": [{"nombre": "Qué se observa", "valores": ["El grado en que un elemento aparece ionizado", "La amplitud de la línea espectral", "La «hondura» de la línea: cuánta luz de esa longitud de onda se absorbe"]}, {"nombre": "Qué indica", "valores": ["Temperatura del gas (energía ás entre sí.", "correcta": false, "retro": "La compresión de los átomos se refleja en el ancho de las líneas, que indica mayor densidad y presión, no en la ionización."}]}]}]}, {"unidad": "reflexion", "titulo": "Lo que vemos no es lo que hay", "pantallas": [{"componente": "prediccion", "titulo": "¿Qué estrellas abundan más?", "texto": "Las estrellas que más destacan en el cielo son las más brillantes. ¿Serán también las más comunes? Elige antes de ver la respuesta.", "piezas": ["p6"], "ventanas": [], "figura": {"busqueda": "", "proposito": "", "img": "", "alt": "", "pie": "", "encuadre": "centro"}, "objetivos": [4], "pregunta": "¿Qué tipo de estrella es el más abundante en el universo?", "opciones": [{"texto": "Tipo O: azules y muy calientes", "correcta": false, "retro": "Las estrellas O y B son raras. Destacan en el cielo porque son extremadamente luminosas, no porque sean muchas."}, {"texto": "Tipo G: amarillas, como el Sol", "correcta": false, "retro": "El insumo no dice que las G sean mayoría. La mayoría de las estrellas del universo son de tipo M."}, {"texto": "Tipo M: rojas, frías y pequeñas", "correcta": true, "retro": "La mayoría de las estrellas del universo son M, frías y pequeñas."}], "revelacion": "La mayoría de las estrellas del universo son **M**, frías y pequeñas. Las **O y B** son raras, pero extremadamente luminosas, y por eso destacan en el cielo. Lo que vemos a simple vista **no refleja la población real** del universo.", "visual": "ninguno", "lineas": 0}, {"componente": "zonas", "titulo": "Volver a Orión", "texto": "Regresa a la pregunta inicial. Toca cada estrella y relaciona su color con su tipo espectral y con lo que realmente abunda en el universo.", "piezas": ["p8", "p6", "p4"], "ventanas": [], "figura": {"busqueda": "", "proposito": "Retomar la imagen de apertura para aplicar la clasificación y el sesgo de luminosidad.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFR tenues de fondo.", "pie": "Constelación de Orión; los colores de sus estrellas indican diferentes clasificaciones estelares. Figura de la presentación original, diapositiva 7.", "encuadre": "centro"}, "objetivos": [4, 2], "modo": "explorar", "consigna": "Toca cada punto de la imagen de Orión. Para cada estrella, piensa qué tipo espectral sugiere su color y si representa a las estrellas más comunes del universo.", "zonas": [{"x": 26, "y": 15, "etiqueta": "Estrella anaranjada", "texto": "Su tono anaranjado-rojizo corresponde a los tipos más fríos de la Clasificación de Harvard: **K** (naranja, 3,700–5,200 K) y **M** (rojas frías, menos de 3,700 K)."}, {"x": 55, "y": 19, "etiqueta": "Estrella azul superior", "texto": "El color azul corresponde a los tipos más calientes: **O** (azules, 30,000–50,000 K) y **B** (azul brillante, 10,000–30,000 K)."}, {"x": 45, "y": 55, "etiqueta": "Tres estrellas alineadas", "texto": "Son estrellas azules y brillantes. Las O y B son **raras**, pero **extremadamente luminosas**; por eso destacan tanto en el cielo."}, {"x": 67, "y": 88, "etiqueta": "Estrella azul inferior", "texto": "Otra estrella azul y brillante, propia de los tipos O o B, los más calientes de la clasificación. Que haya varias a la vista no significa que sean comunes: son raras, pero muy luminosas."}, {"x": 81, "y": 43, "etiqueta": "Estrellas tenues de fondo", "texto": "Lo que domina la vista son las estrellas más luminosas. Sin embargo, la mayoría de las estrellas del universo son **M**, frías y pequeñas: lo que vemos en el cielo no refleja la población real del universo."}]}, {"componente": "reflexion", "titulo": "¿Es representativo lo que vemos?", "texto": "Lo que vemos en el cielo no refleja la población real del universo. Toma postura y explica por qué.", "piezas": ["p6"], "ventanas": [], "figura": {"busqueda": "", "proposito": "", "img": "", "alt": "", "pie": "", "encuadre": "centro"}, "objetivos": [4], "pregunta": "Imagina que cuentas las estrellas más brillantes de Orión para estimar qué tipo de estrella abunda más en el universo. ¿Llegarías a una conclusión correcta? Toma postura y explica qué papel juega la luminosidad de las estrellas O y B frente a la abundancia de las estrellas M.", "ayuda": "Relaciona tres ideas del contenido: la mayoría de las estrellas del universo son M, frías y pequeñas; las O y B son raras, pero extremadamente luminosas; por eso lo que vemos en el cielo no refleja la población real del universo. Piensa qué estrellas «ganan» cuando solo cuentas las que más brillan y cuáles quedan fuera de tu conteo."}]}, {"unidad": "evaluacion", "titulo": "¿Lo comprendí?", "pantallas": [{"componente": "quiz", "titulo": "Comprueba lo que aprendiste", "texto": "Responde las preguntas. Si fallas una, podrás volver a la pantalla donde se explica.", "piezas": ["p2", "p3", "p4", "p5", "p6"], "ventanas": [], "figura": {"busqueda": "", "proposito": "", "img": "", "alt": "", "pie": "", "encuadre": "centro"}, "objetivos": [0, 1, 2, 3, 4], "preguntas": [{"tipo": "opcion", "enunciado": "¿Qué permite saber de qué está hecha una estrella sin acercarse a ella?", "opciones": [{"texto": "Cada elemento químico deja una firma única en su luz, como un código de barras.", "correcta": true, "retro": "La espectroscopía estudia esas huellas que cada elemento deja en la luz; así se sabe de qué está hecha una estrella, qué tan caliente está y cómo se mueve."}, {"texto": "El tamaño aparente de la estrella en el cielo.", "correcta": false, "retro": "El insumo no atribuye al tamaño aparente ninguna información sobre la composición: esta se conoce por las firmas que los elementos dejan en la luz."}, {"texto": "Su posición dentro de una constelación.", "correcta": false, "retro": "La posición en el cielo no revela la composición; lo que la revela es la firma única de cada elemento en el espectro."}], "repaso": "u2p1", "objetivo": 0, "elementos": [], "pares": [], "texto_huecos": "", "huecos": [], "retro": ""}, {"tipo": "vf", "enunciado": "Las estrellas más calientes emiten más luz roja.", "opciones": [{"texto": "Verdadero", "correcta": false, "retro": "Es al revés: las más calientes emiten más luz azul; las frías son las que emiten más luz roja."}, {"texto": "Falso", "correcta": true, "retro": "Las estrellas más calientes emiten más luz azul, y las más frías, más luz roja."}], "repaso": "u2p2", "objetivo": 1, "elementos": [], "pares": [], "texto_huecos": "", "huecos": [], "retro": ""}, {"tipo": "ordenar", "enunciado": "Ordena los tipos espectrales de Harvard de la estrella más caliente a la más fría.", "opciones": [], "repaso": "u2p3", "objetivo": 2, "elementos": ["O – Azules", "B – Azul brillante", "A – Blanco–azuladas", "F – Blanco–amarillentas", "G – Amarillas, como el Sol", "K – Naranja", "M – Rojas frías"], "pares": [], "texto_huecos": "", "huecos": [], "retro": "La Clasificación de Harvard es un orden térmico: va de las O, azules y más calientes, a las M, rojas y más frías. Temperaturas: O 30,000–50,000 K; B 10,000–30,000 K; A 7,500–10,000 K; F 6,000–7,500 K; G 5,200–6,000 K; K 3,700–5,200 K; M <3,700 K."}, {"tipo": "opcion", "enunciado": "El espectro de una estrella está dominado por líneas de helio ionizado. ¿De qué tipo espectral es?", "opciones": [{"texto": "O", "correcta": true, "retro": "Las estrellas O, azules y muy luminosas (30,000–50,000 K), están dominadas por líneas de helio ionizado."}, {"texto": "A", "correcta": false, "retro": "El rasgo de las A es la máxima intensidad en las líneas de hidrógeno, no el helio ionizado."}, {"texto": "M", "correcta": false, "retro": "Las M, rojas y frías (<3,700 K), se reconocen por la abundancia de moléculas como TiO."}], "repaso": "u2p3", "objetivo": 2, "elementos": [], "pares": [], "texto_huecos": "", "huecos": [], "retro": ""}, {"tipo": "relacionar", "enunciado": "Relaciona cada rasgo de las líneas espectrales con lo que indica.", "opciones": [], "repaso": "u3p3", "objetivo": 3, "elementos": [], "pares": [{"izquierda": "Ionización", "derecha": "Temperatura del gas"}, {"izquierda": "Ancho de línea", "derecha": "Presión atmosférica"}, {"izquierda": "Profundidad", "derecha": "Abundancia del elemento"}], "texto_huecos": "", "huecos": [], "retro": "A mayor ionización, mayor temperatura para separar electrones; líneas más anchas señalan mayor densidad y presión porque los átomos comprimidos interactúan más; líneas más profundas implican más cantidad de ese elemento."}, {"tipo": "opcion", "enunciado": "¿Por qué lo que vemos en el cielo no refleja la población real de estrellas del universo?", "opciones": [{"texto": "Porque las O y B, aunque raras, son extremadamente luminosas, mientras la mayoría de las estrellas son M, frías y pequeñas.", "correcta": true, "retro": "La mayoría de las estrellas son M, frías y pequeñas; las O y B son raras pero extremadamente luminosas, por eso destacan en el cielo."}, {"texto": "Porque las estrellas M son las más luminosas.", "correcta": false, "retro": "Las M son frías y pequeñas; las extremadamente luminosas son las O y B."}, {"texto": "Porque las O y B son la mayoría del universo.", "correcta": false, "retro": "Las O y B son raras; la mayoría de las estrellas del universo son M."}], "repaso": "u4p1", "objetivo": 4, "elementos": [], "pares": [], "texto_huecos": "", "huecos": [], "retro": ""}]}]}], "cierre": {"resumen": [], "siguiente": ""}, "referencias": []}</script>
<script>

(function () {
  "use strict";

  function enLinea(texto) {

    String(texto).split(/\n\s*\n/).forEach(function (bloque) {

      var parrafo = [], lista = [];
      function cerrarParrafo() {

    callar();
    var x = pantallas[actual];
    var nodo = x.tipo === "inicio" ? inicio() : (x.tipo === "cierre" ? cierre() : pantallaDe(x));
    if (dir) nodo.classList.add(dir === "atras" ? "desde-izq" : "desde-der");
    main.replaceChildren(nodo);
    window.scrollTo(0, 0);
    var titulo = nodo.querySelector("h1, h2");
    if (titulo) titulo.focus({ preventScroll: true });
    pintarRuta();
    pintarPie();
    pintarVolver();
  }

  function ir(i) {
    if (i < 0 || i >= pantallas.length || document.getElementById("velo")) return;
    var dir = i >= actual ? "adelante" : "atras";
    actual = i;
    vistas[i] = true;
    lms.guardar();
    // Avanzar entra por la derecha; regresar, por la izquierda. Con View
    // Transitions la pantalla vieja también sale; sin ellas, solo entra la nueva.
    if (!QUIETO && document.startViewTransition) {
      document.documentElement.setAttribute("data-dir", dir);
      var t = document.startViewTransition(function () { pintar(); });
      // Si el navegador cancela la animación (pestaña oculta, otra transición
      // encima), la pantalla ya cambió igual: no es un error.
      if (t) {
        [t.ready, t.finished, t.updateCallbackDone].forEach(function (pr) {
          if (pr && pr.catch) pr.catch(function () {});
        });
      }
    } else {
      pintar(QUIETO ? null : dir);
    }
  }

  anterior.addEventListener("click", function () { ir(actual - 1); });
  var botonIndice = document.getElementById("indice"), botonPresentar = document.getElementById("presentar");
  if (botonIndice) botonIndice.addEventListener("click", abrirIndice);
  if (botonPresentar) botonPresentar.addEventListener("click", presentar);
  siguiente.addEventListener("click", function () { ir(actual + 1); });
  document.addEventListener("keydown", function (e) {
    if (document.getElementById("velo")) {
      if (e.key === "Escape") cerrarVentana();
      else if (e.key === "Tab") atrapar(e);
      return;
    }
    var t = (e.target && e.target.tagName) || "";
    if (t === "INPUT" || t === "TEXTAREA" || t === "SELECT" || t === "VIDEO") return;
    if (e.key === "ArrowRight") ir(actual + 1);
    else if (e.key === "ArrowLeft") ir(actual - 1);
  });

  document.getElementById("cab-titulo").textContent = datos.titulo;
  document.title = datos.titulo;
  actual = lms.iniciar();
  vistas[actual] = true;
  pintar();
})();

</script>
</body>
</html>
